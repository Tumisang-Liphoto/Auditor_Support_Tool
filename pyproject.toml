[build-system]
requires = [
    "setuptools>=75",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "auditor-support-tool"
version = "0.1.1"
description = "A modular Windows desktop application supporting data-enabled audit work."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "MIT" }

authors = [
    { name = "Tumisang Liphoto" }
]

keywords = [
    "audit",
    "audit analytics",
    "financial audit",
    "general ledger",
    "desktop application"
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14"
]

dependencies = [
    "PySide6",
    "platformdirs",
    "duckdb",
    "openpyxl",
    "python-docx",
    "packaging"
]

[project.optional-dependencies]

dev = [
    "pytest",
    "pytest-qt",
    "ruff",
    "pyinstaller"
]

[project.scripts]
auditor-support-tool = "auditor_support_tool.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

